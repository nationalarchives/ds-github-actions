---
name: Infrastructure Apply

permissions:
  id-token: write
  contents: write

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      account-id:
        type: string
        required: true
      assume-role:
        type: string
        required: true
      bucket:
        type: string
        required: true
      region:
        type: string
        required: false
        default: "eu-west-2"
      working-directory:
        type: string
        required: false
        default: "components/terraform"
      branch:
        type: string
        required: false
        default: ""
jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: terraform setup
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: "${{ inputs.region }}"
          role-to-assume: "${{ inputs.assume-role }}"
          role-session-name: PlaningSession

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: "${{ inputs.branch }}"

      - name: Copy Environment Vars
        run: |
          cp ./var/${{ inputs.environment }}/terraform/* ./components/terraform/

      - name: Terraform init
        id: init
        run: terraform init -upgrade
        working-directory: ${{ inputs.working-directory }}

      - name: Terraform plan
        id: plan
        run: terraform plan
        working-directory: ${{ inputs.working-directory }}

      - name: Terraform apply
        id: apply
        run: terraform apply -auto-approve -input=false
        working-directory: ${{ inputs.working-directory }}
...
